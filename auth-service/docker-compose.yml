services:
  postgres:
    image: postgres:17-alpine
    container_name: auth-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: firstuser
      POSTGRES_PASSWORD: firstuser
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
