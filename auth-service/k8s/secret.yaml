# IMPORTANT: Never commit real values here.
# Populate DATABASE_URL, REDIS_URL, and JWT_SECRET before applying.
# Example:
#   DATABASE_URL = "postgresql://firstuser:<password>@<tf output: db_endpoint>/authdb"
#   REDIS_URL    = "redis://<tf output: redis_endpoint>:6379"
#   JWT_SECRET   = "<a long random secret, e.g. openssl rand -hex 32>"
#
# kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_RDS_ENDPOINT"
  REDIS_URL: "REPLACE_WITH_ELASTICACHE_ENDPOINT"
  JWT_SECRET: "REPLACE_WITH_STRONG_RANDOM_SECRET"
  JWT_EXPIRATION: "1h"
