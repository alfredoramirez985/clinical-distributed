# IMPORTANT: Never commit real values here.
# Populate DATABASE_URL and REDIS_URL from Terraform outputs before applying.
# Example:
#   DATABASE_URL = "postgresql://firstuser:<password>@<tf output: db_endpoint>/authdb"
#   REDIS_URL    = "redis://<tf output: redis_endpoint>:6379"
#
# kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_RDS_ENDPOINT"
  REDIS_URL: "REPLACE_WITH_ELASTICACHE_ENDPOINT"
