services:
  postgres:
    image: postgres:17-alpine
    container_name: clinical-main-doctor-room-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: doctorroomdb
      POSTGRES_USER: firstuser
      POSTGRES_PASSWORD: firstuser
    ports:
      - "5433:5432"
    volumes:
      - pgdata-doctorroom:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clinical-doctor-room-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata-doctorroom:/data

volumes:
  pgdata-doctorroom:
  redisdata-doctorroom:
